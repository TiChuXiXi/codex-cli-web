<title id="router-worker-architecture-title">Router + Worker Agent 系统架构</title>
<desc id="router-worker-architecture-desc">Codex CLI Web 的 Router 与 Worker 模块拓扑，以及从 Web 和微信接收任务、在原生 Worker 执行、审批交互和回传结果的链路。</desc>
