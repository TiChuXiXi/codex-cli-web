      #router-worker-architecture-root .code, #router-worker-architecture-root .mono, #router-worker-architecture-root .step-num { font-family:"DejaVu Sans Mono","SFMono-Regular",Consolas,monospace }
      #router-worker-architecture-root .code { font-size:12px;fill:#49647A }
      #router-worker-architecture-root .mono { font-size:14px;font-weight:700;fill:#172B3F }
      #router-worker-architecture-root .psm, #router-worker-architecture-root .caption, #router-worker-architecture-root .edge, #router-worker-architecture-root .legend { font-size:13px;fill:#455C70 }
      #router-worker-architecture-root .edge, #router-worker-architecture-root .legend { font-weight:500 }
      #router-worker-architecture-root .step-num { font-size:14px;font-weight:700 }</style>
